<!DOCTYPE html>

<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Passwort</title>
    <link rel="stylesheet" href="../CSS/style.css">
</head>
<body>
    <div class="card">
        <h2>Passwort</h2>
        <input type="password" id="passwordInput" placeholder="Passwort eingeben">
        <button onclick="checkPassword()">ENTER</button>
        <p id="errorMessage" style="color: red; display: none;">Falsches Passwort. Bitte versuche es erneut.</p>
    </div>
    <script>
        function checkPassword() {
            const password = document.getElementById('passwordInput').value;
            const errorMessage = document.getElementById('errorMessage');
            if (password === 'POET') { // Replace '1234' with your desired password
                window.location.href = 'MOOD/overview.html'; // Redirect to index.html on correct password
            } else {
                errorMessage.style.display = 'block'; // Show error message on incorrect password
            }
        }
    </script>
</body>
</html>
